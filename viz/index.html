<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サイバー経済マップ</title>
<style>
:root{--bg:#000;--sf:#0b0f16;--bd:#1c2533;--tx:#e8edf5;--mu:#8a96a8;--pr:#22d3ee;--wn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.5 'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;background:var(--bg)}
#home h1{font-size:26px;letter-spacing:.06em}#home p{color:var(--mu);font-size:12px}
.sbox{position:relative;width:min(520px,88vw)}
.sbox input{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:12px 20px;outline:0;font-size:15px}
.sbox input:focus{border-color:var(--pr)}
.dd{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:60;display:none}
.dd div{padding:8px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}.dd div:hover,.dd .on{background:#14202e}
.dd i{width:8px;height:8px;border-radius:50%;flex:none}.dd small{color:var(--mu);margin-left:auto}
#app{display:none;height:100vh;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--sf)}
#top .sbox{width:260px;margin-left:auto}#top .sbox input{padding:6px 14px;font-size:13px;border-radius:16px}
.tab,.tg{background:none;border:1px solid var(--bd);border-radius:8px;padding:5px 14px;cursor:pointer;color:var(--mu)}
.tab.on{border-color:var(--pr);color:var(--pr);background:#0a1e26}
#stage{flex:1;position:relative;overflow:hidden}canvas{position:absolute;inset:0;cursor:grab}
#panel{position:absolute;top:0;right:0;bottom:0;width:330px;background:rgba(11,15,22,.96);border-left:1px solid var(--bd);padding:14px;overflow-y:auto;transition:transform .2s}
#panel.closed{transform:translateX(100%)}
h2{font-size:16px;margin-bottom:4px}h3{font-size:11px;color:var(--mu);letter-spacing:.06em;margin:14px 0 6px}
.bd{display:inline-block;border:1px solid var(--bd);border-radius:5px;padding:1px 7px;margin:0 4px 4px 0;font-size:11px;color:var(--mu)}
.btn{width:100%;margin:8px 0 0;padding:8px;border-radius:8px;border:1px solid var(--pr);background:#0a1e26;color:var(--pr);cursor:pointer}
.btn.w{border-color:var(--wn);background:#261a06;color:var(--wn)}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;border-radius:5px}.row:hover{background:#14202e}
.row span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{width:70px;height:6px;background:#16202d;border-radius:3px;overflow:hidden;flex:none}.bar b{display:block;height:100%;background:var(--pr)}
.v{font-family:monospace;font-size:11px;color:var(--wn);width:48px;text-align:right}
select{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px}
.note{color:var(--mu);font-size:11px;margin-top:12px}
.grad{height:8px;border-radius:4px;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#f59e0b,#dc2626);margin:6px 0 2px}
</style></head><body>
<div id="home"><h1>サイバー経済マップ</h1><p>日本上場企業ネットワーク ／ 銘柄を入力</p>
<div class="sbox"><input id="q0" placeholder="銘柄（企業名・ティッカー）" autocomplete="off"><div class="dd" id="d0"></div></div></div>
<div id="app"><div id="top"><button class="tab on" id="t1">企業</button><button class="tab" id="t2">What if</button>
<div class="sbox"><input id="q1" placeholder="銘柄を変更" autocomplete="off"><div class="dd" id="d1"></div></div>
<button class="tg" id="tp">タブ ▸</button></div>
<div id="stage"><canvas id="cv"></canvas><div id="panel"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G,SC,byId=new Map(),adj=new Map(),C=null,N=[],E=[],view={k:1,x:0,y:0},sel=null,tab=1,scen='',loss=null,alpha=0,expanded=new Set(),fl=null;
const fmt=m=>!m?'—':m>=1e12?'¥'+(m/1e12).toFixed(2)+'兆':'¥'+Math.round(m/1e8).toLocaleString()+'億';
const wOf=e=>e.share!=null?Math.min(1,e.share/100):.25;
const heat=t=>{t=Math.max(0,Math.min(1,t));return`hsl(${190-190*t},${70+20*t}%,${50-5*t}%)`};
(async()=>{G=await (await fetch('./data/graph.json')).json();
for(const n of G.nodes){byId.set(n.id,n);adj.set(n.id,[])}
for(const e of G.edges){if(!byId.has(e.src)||!byId.has(e.dst))continue;adj.get(e.src).push({o:e.dst,e,out:1});adj.get(e.dst).push({o:e.src,e,out:0})}
try{SC=(await (await fetch('./data/scenarios.json')).json()).scenarios}catch(_){SC={}}})();
function search(inp,dd){let res=[],ai=-1;
const draw=()=>{dd.innerHTML='';res.forEach((n,i)=>{const d=document.createElement('div');if(i==ai)d.className='on';d.innerHTML=`<i style="background:${esc(n.color||'#888')}"></i>${esc(n.name)}<small>${esc(n.ticker)} ${esc(n.sector)}</small>`;d.onclick=()=>pick(n);dd.appendChild(d)});dd.style.display=res.length?'block':'none'};
const pick=n=>{dd.style.display='none';inp.value=n.name;setCenter(n)};
inp.oninput=()=>{const q=inp.value.trim().toLowerCase();ai=-1;res=!q||!G?[]:G.nodes.filter(n=>n.name.toLowerCase().includes(q)||(n.ticker||'').toLowerCase().includes(q)).sort((a,b)=>(b.mcap||0)-(a.mcap||0)).slice(0,8);draw()};
inp.onkeydown=e=>{if(e.key=='ArrowDown'){ai=Math.min(ai+1,res.length-1);draw()}else if(e.key=='ArrowUp'){ai=Math.max(ai-1,0);draw()}else if(e.key=='Enter'&&res.length)pick(res[Math.max(ai,0)])}}
search($('#q0'),$('#d0'));search($('#q1'),$('#d1'));
function setCenter(n){C=n;expanded.clear();sel=null;scen='';loss=null;fl=null;N=[];$('#home').style.display='none';$('#app').style.display='flex';resize();rebuild();setTab(1);view={k:1,x:cv.width/2,y:cv.height/2}}
function rebuild(){const old=new Map(N.map(n=>[n.id,n]));N=[];E=[];const seen=new Map();
const add=(id,tier,par)=>{if(seen.has(id))return seen.get(id);const b=byId.get(id),p=par&&seen.get(par),o=old.get(id);
const n={id,b,tier,par,x:o?o.x:(p?p.x:0)+(Math.random()-.5)*60,y:o?o.y:(p?p.y:0)+(Math.random()-.5)*60,vx:0,vy:0};seen.set(id,n);N.push(n);return n};
add(C.id,0);const nb=(id,skip,cap)=>(adj.get(id)||[]).filter(a=>!skip.has(a.o)).sort((a,b)=>(byId.get(b.o).mcap||0)-(byId.get(a.o).mcap||0)).slice(0,cap);
const t1=nb(C.id,new Set([C.id]),40);for(const a of t1){add(a.o,1,C.id);E.push({s:C.id,d:a.o,e:a.e,tier:1})}
for(const id of expanded)if(seen.has(id))for(const a of nb(id,new Set([C.id]),25)){add(a.o,2,id);E.push({s:id,d:a.o,e:a.e,tier:2})}
alpha=1}
function tick(){if(alpha<.003)return;const idx=new Map(N.map(n=>[n.id,n]));
for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j];const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=2600/d2,fx=dx/d*f,fy=dy/d*f;a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
if(a.b.sector===b.b.sector&&d>60){const s=.004*(d-60)/d;a.vx+=dx*s;a.vy+=dy*s;b.vx-=dx*s;b.vy-=dy*s}}
for(const e of E){const a=idx.get(e.s),b=idx.get(e.d);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,L=e.tier==1?170-wOf(e.e)*60:90,f=(d-L)*.03;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
for(const n of N){if(n.tier==0){n.x=n.y=0;continue}n.vx-=n.x*.002;n.vy-=n.y*.002;n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=.6;n.vy*=.6}
alpha*=.985}
const cv=$('#cv'),cx=cv.getContext('2d');
function resize(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height}
addEventListener('resize',resize);
const rad=n=>(n.tier==0?16:n.tier==1?8:5)+Math.max(0,Math.log10((n.b.mcap||1e9)/1e9))*(n.tier==0?2:1.4);
const lossOf=id=>loss?loss.get(id)||0:0;
function frame(){requestAnimationFrame(frame);if(!C)return;tick();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.setTransform(view.k,0,0,view.k,view.x,view.y);
const idx=new Map(N.map(n=>[n.id,n]));
for(const e of E){const a=idx.get(e.s),b=idx.get(e.d);if(!a||!b)continue;const w=wOf(e.e),hot=sel&&(e.s==sel||e.d==sel);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.lineWidth=(1+w*7)/view.k*(hot?1.4:1);cx.strokeStyle=hot?'rgba(34,211,238,.8)':`rgba(90,140,230,${.2+w*.5})`;cx.setLineDash(e.e.share==null?[5/view.k,4/view.k]:[]);cx.stroke()}
cx.setLineDash([]);cx.textAlign='center';cx.font=`${11/view.k}px sans-serif`;
for(const n of N){const r=rad(n),l=lossOf(n.id);cx.beginPath();cx.arc(n.x,n.y,r,0,7);
cx.fillStyle=loss?(l>.002?heat(l/Math.max(.05,Math.min(.5,fl||.3))):'#1b2433'):(n.b.color||'#667');cx.fill();
if(n.id==C.id||n.id==sel||expanded.has(n.id)){cx.lineWidth=2.5/view.k;cx.strokeStyle=n.id==sel?'#22d3ee':n.id==C.id?'#fff':'#f59e0b';cx.stroke()}
cx.fillStyle=n.tier==2?'#8a96a8':'#e8edf5';cx.fillText(n.b.name.slice(0,12)+(loss&&l>.002?` -${(l*100).toFixed(1)}%`:''),n.x,n.y+r+12/view.k)}}
frame();
const hit=ev=>{const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left-view.x)/view.k,y=(ev.clientY-r.top-view.y)/view.k;for(let i=N.length-1;i>=0;i--){const n=N[i];if(Math.hypot(n.x-x,n.y-y)<rad(n)+4)return n}};
let drag=null;cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,m:0};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=1;view.x=drag.vx+dx;view.y=drag.vy+dy;cv.style.cursor='grabbing'};
cv.onpointerup=e=>{cv.style.cursor='grab';if(drag&&!drag.m){const n=hit(e);sel=n?n.id:null;renderPanel()}drag=null};
cv.ondblclick=e=>{const n=hit(e);if(n&&n.tier==1)toggleExpand(n.id)};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.max(.3,Math.min(4,view.k*(e.deltaY<0?1.12:.89)));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k};
function toggleExpand(id){expanded.has(id)?expanded.delete(id):expanded.add(id);rebuild();if(tab==2)applyScen();renderPanel()}
function setTab(t){tab=t;$('#t1').classList.toggle('on',t==1);$('#t2').classList.toggle('on',t==2);if(t==1)loss=null;else applyScen();renderPanel()}
$('#t1').onclick=()=>setTab(1);$('#t2').onclick=()=>setTab(2);
$('#tp').onclick=()=>{const c=$('#panel').classList.toggle('closed');$('#tp').textContent=c?'◂ タブ':'タブ ▸'};
function failure(id){const L=new Map([[id,1]]);let H=new Map([[id,1]]);
for(let r=0;r<5&&H.size;r++){const M=new Map();for(const[u,h]of H)for(const a of adj.get(u)||[]){if(!a.out)continue;const e=a.e,dep=wOf(e),p=Math.min(1,(e.conf??.5)*dep/.05),add=(e.type=='ownership_parent_of'?.5:.3)*dep*p*h*(1-(L.get(a.o)||0));if(add>1e-4){L.set(a.o,(L.get(a.o)||0)+add);M.set(a.o,(M.get(a.o)||0)+add)}}H=M}return L}
function applyScen(){loss=null;fl=null;if(scen=='fail'){loss=failure(C.id);loss.set(C.id,1);fl=.5}else if(scen&&SC[scen]){loss=new Map(Object.entries(SC[scen].loss_map||{}));fl=Math.min(.3,Math.max(.05,...loss.values()))}}
function adjE(id){const a=(adj.get(C.id)||[]).find(x=>x.o==id);return a?a.e:{}}
function renderPanel(){const p=$('#panel'),deg=(adj.get(C.id)||[]).length,b=C;
if(tab==1){const t1=N.filter(n=>n.tier==1).sort((a,b)=>wOf(adjE(b.id))-wOf(adjE(a.id)));
let h=`<h2>${esc(b.name)}</h2><span class="bd">${esc(b.ticker||'—')}</span><span class="bd">${esc(b.sector)}</span><span class="bd">接続 ${deg}社</span>
<div style="color:var(--pr);font:600 15px monospace;margin:6px 0">時価総額 ${fmt(b.mcap)}</div>
<button class="btn w" id="gw">What if…？（この会社が倒れたら／リスクが起きたら）</button>`;
const s=sel&&byId.get(sel);if(s&&sel!=C.id){const n=N.find(x=>x.id==sel);h+=`<h3>選択中</h3><b>${esc(s.name)}</b> <span class="bd">${esc(s.sector)}</span><div style="color:var(--mu)">時価総額 ${fmt(s.mcap)}</div>`;
if(n&&n.tier==1)h+=`<button class="btn" id="gx">${expanded.has(sel)?'ノードを閉じる':'ノードを見る（その取引先を展開）'}</button>`}
h+=`<h3>一次の取引先・関連企業 ${t1.length}／${deg}　線の太さ＝影響の強さ</h3>`;
for(const n of t1){const e=adjE(n.id),w=e.share!=null;h+=`<div class="row" data-id="${n.id}"><span class="n">${esc(n.b.name)}</span><span class="bar"><b style="width:${wOf(e)*100}%;${w?'':'opacity:.35'}"></b></span><span class="v">${w?e.share.toFixed(1)+'%':'不明'}</span></div>`}
h+=`<div class="note">％は当該エッジの持株比率等（相手から見たこの会社の重要度の目安）。「不明」は未観測で、破線表示・仮定値0.25で扱います。供給網の観測エッジは少なく、資本関係が中心です。</div>`;
p.innerHTML=h;$('#gw').onclick=()=>setTab(2);const gx=$('#gx');if(gx)gx.onclick=()=>toggleExpand(sel)}
else{let o='<option value="">— 選択 —</option><option value="fail"'+(scen=='fail'?' selected':'')+'>この会社が倒産した場合</option>';
for(const k in SC)o+=`<option value="${esc(k)}"${scen==k?' selected':''}>${esc(SC[k].label||k)}</option>`;
let h=`<h2>What if</h2><div style="color:var(--mu);margin-bottom:8px">${esc(b.name)} と展開中の企業への影響</div><select id="ss">${o}</select>`;
if(loss){const vis=N.map(n=>({n,l:lossOf(n.id)})).filter(x=>x.l>.002&&x.n.id!=C.id).sort((a,b)=>b.l-a.l);
h+=scen=='fail'?`<div class="note" style="margin-top:8px">倒産時の波及を、旧エンジンと同じ係数（持株50%・供給30%×依存度）で簡易計算（期待値・親→子の向きに伝播）。</div>`:`<div class="note" style="margin-top:8px">${esc(SC[scen].description||'')}</div>`;
const all=[...loss].filter(([id])=>id!=C.id).sort((a,b)=>b[1]-a[1]);
h+=`<div class="grad"></div><div style="display:flex;justify-content:space-between;color:var(--mu);font-size:10px"><span>±0%</span><span>損失 ${Math.round(fl*100)}%+</span></div>
<h3>${esc(b.name)} の損失</h3><div style="font:700 20px monospace;color:var(--wn)">-${(lossOf(C.id)*100).toFixed(1)}%</div>
<h3>展開中ノードへの影響（${vis.length}社）</h3>`;
for(const x of vis.slice(0,12))h+=`<div class="row" data-id="${x.n.id}"><span class="n">${esc(x.n.b.name)}</span><span class="v">-${(x.l*100).toFixed(1)}%</span></div>`;
if(!vis.length)h+='<div class="note">展開中のノードに影響なし。企業タブで一次を展開すると二次への波及も見られます。</div>';
h+=`<h3>全体の影響TOP8</h3>`;for(const[id,l]of all.slice(0,8)){const n=byId.get(id);if(n)h+=`<div class="row" data-id="${id}"><span class="n">${esc(n.name)}</span><span class="v">-${(l*100).toFixed(1)}%</span></div>`}
h+=`<div class="note">試算値です。実際の損失額・倒産確率・予測ではありません（README参照）。</div>`}
else h+='<div class="note" style="margin-top:10px">シナリオを選ぶと、ノードが損失の大きさで着色されます。</div>';
p.innerHTML=h;$('#ss').onchange=e=>{scen=e.target.value;applyScen();renderPanel()}}
p.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const id=r.dataset.id;if(N.some(n=>n.id==id)){sel=id;renderPanel()}else setCenter(byId.get(id))})}
</script></body></html>
