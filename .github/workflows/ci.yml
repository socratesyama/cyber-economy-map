name: Data integrity and legacy viewer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-workbench.txt
      - name: Rebuild research data snapshot
        run: python scripts/export_workbench.py
      - name: Validate provenance, checksums and flow data
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Syntax-check the restored legacy engine scripts
        run: python -m py_compile scripts/scenario_engine.py scripts/export_viz.py
      - name: Validate the static viewer and its data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert Path("viz/index.html").is_file()
          for path in ("viz/data/graph.json", "viz/data/scenarios.json"):
              json.loads(Path(path).read_text(encoding="utf-8"))
          PY
